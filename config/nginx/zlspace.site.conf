# zlspace.site — 多项目子路径部署
# - /portfolio/       作品集官网
# - /bookkeeping/     静记 PC Web + API (PM2: family-bookkeeping-api → :3000)
# - /lifetracker/     LifeTracker Web + API (port 3020)
# - /smart-station/   智能快递驿站 Web + API (PM2: smart-station-api → :3030)
# 注意：任意项目 deploy-cvm 若上传 conf 会覆盖本文件；请保持各仓库 conf 同步。

# ---- HTTP: 80 -> 301 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name zlspace.site www.zlspace.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: 443 (域名, Let's Encrypt) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name zlspace.site www.zlspace.site;

    ssl_certificate     /etc/letsencrypt/live/zlspace.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zlspace.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # 根路径默认进作品集（个人官网入口）
    location = / {
        return 301 https://$host/portfolio/;
    }

    # ---- 作品集 /portfolio/ ----
    location = /portfolio {
        return 301 https://$host/portfolio/;
    }

    location /portfolio/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /portfolio/index.html;
    }

    # ---- 静记 /bookkeeping/ ----
    location = /bookkeeping {
        return 301 https://$host/bookkeeping/;
    }

    location /bookkeeping/ {
        alias /var/www/family-bookkeeping/;
        index index.html;
        try_files $uri $uri/ /bookkeeping/index.html;
    }

    location /bookkeeping/api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /bookkeeping;
    }

    # 向后兼容：旧 /api 直连静记（小程序等）
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- LifeTracker /lifetracker/ ----
    location = /lifetracker {
        return 301 https://$host/lifetracker/;
    }

    location /lifetracker/ {
        alias /var/www/life-tracker/;
        index index.html;
        try_files $uri $uri/ /lifetracker/index.html;
    }

    location /lifetracker/api/ {
        proxy_pass http://127.0.0.1:3020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /lifetracker;
    }

    location /lifetracker/socket.io/ {
        proxy_pass http://127.0.0.1:3020/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 智能快递驿站 /smart-station/ ----
    location = /smart-station {
        return 301 https://$host/smart-station/;
    }

    location /smart-station/ {
        alias /var/www/smart-station/;
        index index.html;
        try_files $uri $uri/ /smart-station/index.html;
    }

    location /smart-station/api/ {
        proxy_pass http://127.0.0.1:3030/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /smart-station;
    }

    location / {
        return 404;
    }
}

